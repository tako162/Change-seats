<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="席替え" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="favicon.ico" sizes="180x180" />
    <title>席替え</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="grid.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="wrapper">
        <div class="main-content">
            <div class="blackBoard">
                <div class="board">DEV</div>
            </div>            
            <div class="parent"></div>
            <div class="button-wrapper">
                <button class="drawButton" type="button" onclick="drawNextMemberWithRandomHighlight()">シャッフル</button>
            </div>

            <div class="controls">
                <input type="checkbox" id="frontMode" class="frontModeInput" style="display:none" name="name" />
                <label for="frontMode" class="frontModeLabel">前2列モード</label>
                <button class="simultaneousVotingButton" type="button" onclick="drawAllMembers()">一斉投票</button>
                <button class="resetButton" type="button" onclick="window.location.reload(false)">リセット</button>
            </div>
        </div>
    </div>

    <footer>
        <p>Ver. DEV</p>
        <p>devブランチですよ！！！</p>
    </footer>

    <script src="script.js"></script>
</body>


</html>
