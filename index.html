<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="席替え" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="favicon.ico" sizes="180x180" />
    <title>席替え</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="grid.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="wrapper">
        <div class="main-content">
            <div class="blackBoard">
                <div class="board">黒板</div>
            </div>

            <div class="parent">
                <!-- 37席分の空divを一括で記述 -->
                <!-- 必要であればJavaScriptやテンプレートで生成する方法も検討可能 -->
                <div class="div1"></div>
                <div class="div2"></div>
                <div class="div3"></div>
                <div class="div4"></div>
                <div class="div5"></div>
                <div class="div6"></div>
                <div class="div7"></div>
                <div class="div8"></div>
                <div class="div9"></div>
                <div class="div10"></div>
                <div class="div11"></div>
                <div class="div12"></div>
                <div class="div13"></div>
                <div class="div14"></div>
                <div class="div15"></div>
                <div class="div16"></div>
                <div class="div17"></div>
                <div class="div18"></div>
                <div class="div19"></div>
                <div class="div20"></div>
                <div class="div21"></div>
                <div class="div22"></div>
                <div class="div23"></div>
                <div class="div24"></div>
                <div class="div25"></div>
                <div class="div26"></div>
                <div class="div27"></div>
                <div class="div28"></div>
                <div class="div29"></div>
                <div class="div30"></div>
                <div class="div31"></div>
                <div class="div32"></div>
                <div class="div33"></div>
                <div class="div34"></div>
                <div class="div35"></div>
                <div class="div36"></div>
                <div class="div37"></div>
            </div>

            <div class="button-wrapper">
                <button class="drawButton" type="button" onclick="drawNextMemberWithRandomHighlight()">シャッフル</button>
            </div>

            <div class="controls">
                <input type="checkbox" id="frontMode" class="frontModeInput" style="display:none" name="name" />
                <label for="frontMode" class="frontModeLabel">前2列モード</label>
                <button class="simultaneousVotingButton" type="button" onclick="drawAllMembers()">一斉投票</button>
                <button class="resetButton" type="button" onclick="window.location.reload(false)">リセット</button>
            </div>
        </div>
    </div>

    <footer>
        <p>Ver. 2.0.0</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
